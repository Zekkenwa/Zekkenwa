name: Update MAL Stats

on:
  schedule:
    - cron: "30 3 * * *" # once daily at 03:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate MAL stats card
        id: generate
        env:
          MAL_USER: "RFA-Chan"
          OUTPUT_PATH: "mal-stats.svg"
        run: python .github/scripts/generate-mal-card.py
        continue-on-error: true

      - name: Check generation result
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::warning::MAL stats generation failed (API may be down). Skipping update."
          exit 0

      - name: Commit and push changes
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mal-stats.svg
          git diff --cached --quiet || (git commit -m "ðŸŽŒ Update MAL stats card" && git push)
